# Cenário 2: inscrição (seleciona o ingresso Comum e clica em Realizar inscrição).
#
# Este arquivo NÃO tem o fluxo. O fluxo (as requisições) vem da gravação do Cypress:
#   npm run inscricao:gravar   → grava gravacoes/inscricao.json
# e é montado automaticamente em tests/gerado/inscricao.yml a cada execução.
#
# Aqui ficam só as pausas, os degraus de carga e os critérios de aprovação.

# Pausas do usuário virtual, em segundos.
pausas:
  porClique: 5    # antes de cada clique gravado (tempo de "pensar" do usuário)
  noFinal: 10     # tempo parado na página de checkout no fim do fluxo

# Com 2 cliques: cada usuário fica cerca de 5 + 5 + 10 = 20 segundos no fluxo, então
#   usuários simultâneos ≈ novos acessos por segundo × 20
#   arrivalRate 50/s  →  ~1.000 usuários simultâneos

config:
  processor: "../../src/processor.ts"
  http:
    timeout: 30
  plugins:
    ensure: {}
    metrics-by-endpoint:
      useOnlyRequestNames: true
  ensure:
    thresholds:
      - "http.response_time.p95": 1000
      - "http.response_time.p99": 2500
    conditions:
      - expression: "vusers.failed == 0"
        strict: false

  environments:
    smoke:
      phases:
        - name: "smoke"
          duration: 2
          arrivalRate: 1

    c100:
      phases:
        - name: "sobe até 100 simultâneos"
          duration: 30
          arrivalRate: 1
          rampTo: 5
        - name: "segura 100"
          duration: 60
          arrivalRate: 5

    c500:
      phases:
        - name: "sobe até 500 simultâneos"
          duration: 60
          arrivalRate: 1
          rampTo: 25
        - name: "segura 500"
          duration: 60
          arrivalRate: 25

    c1k:
      phases:
        - name: "sobe até 1 mil simultâneos"
          duration: 60
          arrivalRate: 1
          rampTo: 50
        - name: "segura 1 mil"
          duration: 120
          arrivalRate: 50

    # Pico de abertura de vendas: mil pessoas chegando em 10 segundos, cada uma se inscreve
    # uma vez só e ninguém é reposto. Cria cerca de 1.000 reservas no total (não 7.500 como o c1k).
    # Com as pausas do usuário, as reservas acontecem entre 10 e 20 segundos após o início,
    # perto de 100 por segundo.
    pico:
      phases:
        - name: "pico: 1.000 inscrições em 10 s"
          duration: 10
          arrivalRate: 100

    # Todos os degraus em sequência
    degraus:
      phases:
        - name: "sobe até 100"
          duration: 30
          arrivalRate: 1
          rampTo: 5
        - name: "segura 100"
          duration: 60
          arrivalRate: 5
        - name: "sobe até 500"
          duration: 30
          arrivalRate: 5
          rampTo: 25
        - name: "segura 500"
          duration: 60
          arrivalRate: 25
        - name: "sobe até 1 mil"
          duration: 30
          arrivalRate: 25
          rampTo: 50
        - name: "segura 1 mil"
          duration: 120
          arrivalRate: 50
