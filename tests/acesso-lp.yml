# Teste de acesso à landing page, sem interagir com elementos.
#
# Cada usuário virtual faz o que o navegador faz ao abrir a página:
#   1. baixa a página (LP_URL no .env)
#   2. chama a API que carrega os ingressos (LP_API_INGRESSOS no .env; se vazia, essa etapa é pulada)
#
# Como a carga funciona: cada usuário virtual acessa a página e fica 10s "nela".
# Então  usuários simultâneos ≈ chegadas por segundo × 10.
#   arrivalRate 1500/s  →  ~15.000 usuários simultâneos
#
# Rodar:  npm run acesso:smoke     (validação rápida, ~10 acessos)
#         npm run acesso:100       (um degrau só; também acesso:1k, acesso:5k, acesso:15k)
#         npm run acesso:completo  (todos os degraus em sequência até 15 mil)
#
# Este cenário não tem critério de aprovação: o objetivo é achar onde o ambiente cede.
# Toda execução gera um relatório visual com o diagnóstico de gargalo em reports/.

config:
  # O endereço real vem de LP_URL no arquivo .env (veja .env.example). O scripts/rodar.mts
  # separa a URL e passa o domínio como --target e o caminho como a variável "pagina".
  target: "http://localhost"
  processor: "../src/processor.ts"
  http:
    timeout: 30
  plugins:
    # Tempo e resultado de cada etapa separados no relatório.
    metrics-by-endpoint:
      useOnlyRequestNames: true

  environments:
    smoke:
      phases:
        - name: "smoke"
          duration: 10
          arrivalRate: 1

    # Um degrau por vez (npm run acesso:100, acesso:1k, acesso:5k, acesso:15k)
    c100:
      phases:
        - name: "sobe até 100 simultâneos"
          duration: 30
          arrivalRate: 1
          rampTo: 10
        - name: "segura 100"
          duration: 60
          arrivalRate: 10

    c1k:
      phases:
        - name: "sobe até 1 mil"
          duration: 30
          arrivalRate: 1
          rampTo: 100
        - name: "segura 1 mil"
          duration: 60
          arrivalRate: 100

    c5k:
      phases:
        - name: "sobe até 5 mil"
          duration: 60
          arrivalRate: 1
          rampTo: 500
        - name: "segura 5 mil"
          duration: 60
          arrivalRate: 500

    c15k:
      phases:
        - name: "sobe até 15 mil"
          duration: 120
          arrivalRate: 1
          rampTo: 1500
        - name: "segura 15 mil"
          duration: 120
          arrivalRate: 1500

    # Todos os degraus em sequência (npm run acesso:completo)
    degraus:
      phases:
        - name: "sobe até 100 simultâneos"
          duration: 30
          arrivalRate: 1
          rampTo: 10
        - name: "segura 100"
          duration: 60
          arrivalRate: 10
        - name: "sobe até 1 mil"
          duration: 30
          arrivalRate: 10
          rampTo: 100
        - name: "segura 1 mil"
          duration: 60
          arrivalRate: 100
        - name: "sobe até 5 mil"
          duration: 30
          arrivalRate: 100
          rampTo: 500
        - name: "segura 5 mil"
          duration: 60
          arrivalRate: 500
        - name: "sobe até 15 mil"
          duration: 60
          arrivalRate: 500
          rampTo: 1500
        - name: "segura 15 mil"
          duration: 120
          arrivalRate: 1500

scenarios:
  - name: "Acessa a landing page"
    flow:
      - get:
          name: "1. GET landing page"
          url: "{{ pagina }}"
          afterResponse: "contarRespostas"
      - get:
          name: "2. GET API de ingressos"
          url: "{{ apiIngressos }}"
          ifTrue: "apiIngressos"
          afterResponse: "contarRespostas"
      - think: 10
